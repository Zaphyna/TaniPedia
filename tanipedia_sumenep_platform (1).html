        function KioskDirectoryView({ kiosks, allKiosks, selectedDistrict, setSelectedDistrict, searchQuery, setSearchQuery, selectedKiosk, setSelectedKiosk }) {
            const mapRef = useRef(null);
            const leafletMap = useRef(null);
            const markersRef = useRef({});

            const districts = ['All', 'Lenteng', 'Gapura', 'Batuan', 'Rubaru', 'Ganding', 'Kota Sumenep'];

            // Initialize Leaflet Map
            useEffect(() => {
                if (!mapRef.current) return;
                
                if (!leafletMap.current) {
                    // Center at Sumenep Alun-Alun (-6.9841, 113.8672)
                    leafletMap.current = L.map(mapRef.current).setView([-6.9750, 113.8400], 11);
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                    }).addTo(leafletMap.current);
                }

                // Clear previous markers
                Object.values(markersRef.current).forEach(marker => marker.remove());
                markersRef.current = {};

                // Add current filtered kiosk markers
                kiosks.forEach(kiosk => {
                    const customIcon = L.divIcon({
                        className: 'custom-leaflet-marker',
                        html: `<div style="background-color: #287A46; width: 28px; height: 28px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 10px;">🏪</div>`,
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    });

                    const marker = L.marker([kiosk.lat, kiosk.lng], { icon: customIcon })
                        .addTo(leafletMap.current)
                        .bindPopup(`
                            <div style="font-family: sans-serif; width: 220px; text-align: left;">
                                <img src="${kiosk.photograph}" style="width: 100%; height: 90px; object-fit: cover; border-radius: 6px; margin-bottom: 6px;"/>
                                <strong style="font-size: 13px; color: #26352B; display: block; margin-bottom: 2px;">${kiosk.name}</strong>
                                <span style="font-size: 11px; color: #788579; display: block; margin-bottom: 8px;">${kiosk.address}</span>
                                <a href="https://www.google.com/maps/dir/?api=1&destination=${kiosk.lat},${kiosk.lng}" target="_blank" style="display: inline-block; width: 100%; text-align: center; background-color: #287A46; color: white; padding: 6px 0; border-radius: 6px; font-size: 11px; font-weight: bold; text-decoration: none;">
                                    Navigasi Google Maps →
                                </a>
                            </div>
                        `);

                    marker.on('click', () => {
                        setSelectedKiosk(kiosk);
                    });

                    markersRef.current[kiosk.id] = marker;
                });
            }, [kiosks]);

            // Fly to kiosk when selected
            useEffect(() => {
                if (selectedKiosk && leafletMap.current) {
                    leafletMap.current.flyTo([selectedKiosk.lat, selectedKiosk.lng], 14, { duration: 1.5 });
                    if (markersRef.current[selectedKiosk.id]) {
                        markersRef.current[selectedKiosk.id].openPopup();
                    }
                }
            }, [selectedKiosk]);

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

                        <h1 className="text-3xl font-extrabold text-darktext tracking-tight">Direktori & Peta Kios Pertanian Sumenep</h1>

                                        value={newContribution.title}
                                        onChange={(e) => setNewContribution({ ...newContribution, title: e.target.value })}
                                        className="w-full bg-background border border-bordercolor p-2.5 rounded-xl text-xs focus:outline-none focus:border-primary"
                                    />
                                </div>

                                <div className="space-y-1">
                                    <label className="text-xs font-bold text-darktext">Kategori:</label>
                                    <select 
                                        value={newContribution.category}
                                        onChange={(e) => setNewContribution({ ...newContribution, category: e.target.value })}
                                        className="w-full bg-background border border-bordercolor p-2.5 rounded-xl text-xs focus:outline-none focus:border-primary"
                                    >
                                        <option value="Budidaya">Pengalaman Budidaya</option>
                                        <option value="Hama">Laporan Hama & Penyakit</option>
                                        <option value="Tips">Tips Hemat Pupuk</option>
                                    </select>
                                </div>

                                <div className="space-y-1">
                                    <label className="text-xs font-bold text-darktext">Isi Penjelasan / Catatan:</label>
                                    <textarea 
                                        rows="4" 
                                        placeholder="Tuliskan pengalaman atau saran Anda..."
                                        value={newContribution.content}
                                        onChange={(e) => setNewContribution({ ...newContribution, content: e.target.value })}
                                        className="w-full bg-background border border-bordercolor p-2.5 rounded-xl text-xs focus:outline-none focus:border-primary"
                                    ></textarea>
                                </div>

                                <button 
                                    type="submit"
                                    className="w-full bg-primary hover:bg-primary-dark text-white font-bold text-xs py-3 rounded-xl transition-all shadow-sm"
                                >
                                    Kirimkan Kontribusi
                                </button>
                            </form>
                        </div>

                        {/* LIST KONTRIBUSI */}
                        <div className="lg:col-span-2 space-y-4">
                            <h2 className="text-lg font-bold text-darktext">Diskusi & Kiriman Terbaru</h2>

                            <div className="space-y-4">
                                {contributions.map(item => (
                                    <div key={item.id} className="bg-surface p-6 rounded-3xl border border-bordercolor shadow-sm space-y-3">
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center space-x-2">
                                                <span className="w-8 h-8 rounded-full bg-emerald-100 text-primary font-bold flex items-center justify-center text-xs">
                                                    {item.author.charAt(0)}
                                                </span>
                                                <div>
                                                    <h4 className="font-bold text-sm text-darktext">{item.author}</h4>
                                                    <span className="text-[10px] text-muted">{item.date}</span>
                                                </div>
                                            </div>

                                            <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full ${
                                                item.status === 'approved' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                                            }`}>
                                                {item.status === 'approved' ? 'Terverifikasi' : 'Menunggu Moderasi Admin'}
                                            </span>
                                        </div>

                                        <h3 className="font-bold text-base text-darktext">{item.title}</h3>
                                        <p className="text-xs text-muted leading-relaxed whitespace-pre-line">{item.content}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- SECTION: DASHBOARD PEMILIK KIOS & ADMIN VIEW ---
        function DashboardView({ kiosks, setKiosks, showToast }) {
            const [selectedKioskId, setSelectedKioskId] = useState(kiosks[0]?.id || '');
            const activeKiosk = kiosks.find(k => k.id === selectedKioskId) || kiosks[0];

            const handleToggleStock = (productName) => {
                const updatedKiosks = kiosks.map(k => {
                    if (k.id === activeKiosk.id) {
                        const currentStatus = k.stocks[productName]?.status || 'available';
                        const newStatus = currentStatus === 'available' ? 'out_of_stock' : 'available';
                        return {
                            ...k,
                            stocks: {
                                ...k.stocks,
                                [productName]: {
                                    ...k.stocks[productName],
                                    status: newStatus,
                                    updated: 'Baru saja'
                                }
                            }
                        };
                    }
                    return k;
                });
                setKiosks(updatedKiosks);
                showToast(`Status stok ${productName} berhasil diperbarui.`);
            };

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                    <div>
                        <h1 className="text-3xl font-extrabold text-darktext tracking-tight">Dashboard Pengelolaan Kios Pertanian</h1>
                        <p className="text-sm text-muted mt-1">Panel pemilik kios untuk memperbarui ketersediaan pupuk dan informasi operasional secara mandiri.</p>
                    </div>

                    <div className="bg-surface p-6 rounded-3xl border border-bordercolor shadow-sm space-y-6">
                        {/* SELECT KIOSK TO MANAGE */}
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-bordercolor pb-6">
                            <div>
                                <label className="text-xs font-bold text-darktext uppercase tracking-wider block mb-1">Pilih Kios yang Dikelola:</label>
                                <select 
                                    value={selectedKioskId}
                                    onChange={(e) => setSelectedKioskId(e.target.value)}
                                    className="bg-background border border-bordercolor rounded-xl px-4 py-2.5 text-xs font-bold text-darktext focus:outline-none focus:border-primary"
                                >
                                    {kiosks.map(k => (
                                        <option key={k.id} value={k.id}>{k.name} ({k.district})</option>
                                    ))}
                                </select>
                            </div>

                            <div className="flex items-center space-x-2 text-xs text-muted">
                                <span>Status Verifikasi Kios:</span>
                                <span className="bg-emerald-100 text-emerald-800 font-extrabold px-2.5 py-1 rounded-full text-[10px]">TERVERIFIKASI</span>
                            </div>
                        </div>

                        {/* MANAGE STOCKS */}
                        <div className="space-y-4">
                            <h3 className="font-bold text-base text-darktext">Kelola Stok Produk ({activeKiosk?.name})</h3>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {Object.entries(activeKiosk?.stocks || {}).map(([product, data]) => (
                                    <div key={product} className="bg-background p-4 rounded-2xl border border-bordercolor flex items-center justify-between">
                                        <div>
                                            <h4 className="font-bold text-sm text-darktext">{product}</h4>
                                            <span className="text-[10px] text-muted">Terakhir diperbarui: {data.updated}</span>
                                        </div>

                                        <button 
                                            onClick={() => handleToggleStock(product)}
                                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                                                data.status === 'available'
                                                    ? 'bg-emerald-600 text-white hover:bg-emerald-700'
                                                    : 'bg-red-500 text-white hover:bg-red-600'
                                            }`}
                                        >
                                            {data.status === 'available' ? 'Tersedia' : 'Habis'}
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- RENDER REACT APP ---
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
